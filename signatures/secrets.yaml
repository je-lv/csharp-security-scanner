name: Sensitive Data Exposure
description: Detects hardcoded secrets and secure secret management patterns

secure:
  - id: config_secrets
    name: Configuration Secrets
    pattern: 'Configuration\[|IConfiguration.*Get|GetConnectionString|AddUserSecrets'
    description: Secrets from configuration

  - id: key_vault
    name: Azure Key Vault
    pattern: 'KeyVaultClient|SecretClient|Azure\.Security\.KeyVault|AddAzureKeyVault'
    description: Azure Key Vault integration

  - id: env_vars
    name: Environment Variables
    pattern: 'Environment\.GetEnvironmentVariable'
    description: Secrets from environment variables

vulnerable:
  - id: hardcoded_connstr
    name: Hardcoded Connection String
    pattern: '[Cc]onnection[Ss]tring\s*=\s*"[^"]*([Ss]erver|[Dd]ata [Ss]ource|[Pp]assword|[Uu]id)'
    risk: HIGH
    description: Hardcoded database connection string
    remediation: Use configuration or secret management

  - id: connstr_attr
    name: Connection String Attribute
    pattern: 'connectionString\s*=\s*"'
    risk: HIGH
    description: Connection string in config attribute
    remediation: Use encrypted configuration or external secret store

  - id: hardcoded_creds
    name: Hardcoded Credentials
    pattern: '(username|user|login)\s*=\s*"[^"]+"|NetworkCredential\s*\(\s*"[^"]+"\s*,\s*"[^"]+"'
    risk: HIGH
    description: Hardcoded username/credentials
    remediation: Use secure credential storage

  - id: hardcoded_pwd
    name: Hardcoded Password
    pattern: '(password|passwd|pwd)\s*[:=]\s*"[^"]{4,}"'
    risk: HIGH
    description: Hardcoded password
    remediation: Use secure secret management

  - id: hardcoded_apikey
    name: Hardcoded API Key
    pattern: '(api[_-]?key|apikey|api[_-]?secret|bearer)\s*[:=]\s*"[A-Za-z0-9_\-]{16,}"'
    risk: HIGH
    description: Hardcoded API key
    remediation: Use environment variables or secret management

  - id: aws_creds
    name: AWS Credentials
    pattern: 'AKIA[0-9A-Z]{16}|aws_secret_access_key|aws_access_key_id'
    risk: HIGH
    description: AWS credentials in code
    remediation: Use IAM roles or AWS Secrets Manager

  - id: private_key
    name: Private Key
    pattern: 'BEGIN (RSA |DSA |EC |OPENSSH )?PRIVATE KEY'
    risk: HIGH
    description: Private key in code
    remediation: Use certificate store or Key Vault

  - id: jwt_secret
    name: JWT Secret
    pattern: '(jwt[_-]?secret|jwt[_-]?key|SigningKey|IssuerSigningKey)\s*[:=]\s*"[^"]{8,}"'
    risk: HIGH
    description: Hardcoded JWT signing key
    remediation: Use secure key management

  - id: commented_secret
    name: Commented Secret
    pattern: "(//|#|/\\*|<!--).*([Pp]assword|[Ss]ecret|[Kk]ey|[Tt]oken)\\s*[:=]\\s*[\"'][^\"']{4,}"
    risk: HIGH
    description: Secret in code comment
    remediation: Remove secrets from comments

  - id: azure_creds
    name: Azure Credentials
    pattern: 'AccountKey\s*=|SharedAccessSignature|DefaultEndpointsProtocol.*AccountKey'
    risk: HIGH
    description: Azure credentials in code
    remediation: Use Managed Identity or Key Vault

  - id: secrets_in_logs
    name: Secrets in Logs
    pattern: '(Log|Logger|_logger)\.(Info|Debug|Error|Warn).*([Pp]assword|[Ss]ecret|[Tt]oken|[Kk]ey)'
    risk: HIGH
    description: Sensitive data logged
    remediation: Never log secrets or credentials
