name: Cryptography
description: Detects weak cryptographic implementations and secure patterns

secure:
  - id: aes
    name: AES Encryption
    pattern: 'Aes\.Create|AesGcm|AesCcm|AesCryptoServiceProvider'
    description: AES symmetric encryption

  - id: rsa
    name: RSA Encryption
    pattern: 'RSA\.Create|RSACng|RSACryptoServiceProvider'
    description: RSA asymmetric encryption

  - id: secure_rng
    name: Secure RNG
    pattern: 'RandomNumberGenerator\.(Create|Fill|GetBytes|GetInt32)|RNGCryptoServiceProvider'
    description: Cryptographically secure random number generation

  - id: pbkdf2
    name: PBKDF2
    pattern: 'Rfc2898DeriveBytes|KeyDerivation\.Pbkdf2'
    description: PBKDF2 key derivation

  - id: bcrypt
    name: BCrypt/Argon2
    pattern: 'BCrypt\.(HashPassword|Verify)|Argon2|PasswordHasher<'
    description: Secure password hashing

  - id: hmac
    name: HMAC
    pattern: 'HMACSHA256|HMACSHA384|HMACSHA512'
    description: HMAC message authentication

vulnerable:
  - id: md5
    name: MD5
    pattern: 'MD5\.Create|MD5CryptoServiceProvider|MD5\.HashData|\.ComputeHash.*MD5'
    risk: HIGH
    description: MD5 is cryptographically broken
    remediation: Use SHA-256 or stronger for integrity, bcrypt/argon2 for passwords

  - id: sha1
    name: SHA1
    pattern: 'SHA1\.Create|SHA1CryptoServiceProvider|SHA1Managed|SHA1\.HashData|\.ComputeHash.*SHA1'
    risk: HIGH
    description: SHA1 is cryptographically weak
    remediation: Use SHA-256 or stronger

  - id: des
    name: DES/3DES
    pattern: 'DES\.Create|DESCryptoServiceProvider|TripleDES'
    risk: HIGH
    description: DES/3DES are obsolete
    remediation: Use AES-256

  - id: ecb
    name: ECB Mode
    pattern: 'CipherMode\.ECB'
    risk: HIGH
    description: ECB mode reveals patterns in encrypted data
    remediation: Use CBC, GCM, or CTR mode

  - id: hardcoded_keys
    name: Hardcoded Keys
    pattern: '(Key|IV|key|iv)\s*=\s*(new\s+byte\s*\[\s*\]\s*\{|Convert\.FromBase64String\s*\(\s*")'
    risk: HIGH
    description: Hardcoded encryption keys
    remediation: Use secure key management (Key Vault, HSM)

  - id: cert_bypass
    name: Certificate Bypass
    pattern: 'ServerCertificateValidationCallback.*[Tt]rue|RemoteCertificateValidationCallback.*[Tt]rue'
    risk: HIGH
    description: SSL/TLS certificate validation disabled
    remediation: Implement proper certificate validation

  - id: insecure_tls
    name: Insecure TLS
    pattern: 'SecurityProtocolType\.(Ssl3|Tls[^1]|Tls11)|SslProtocols\.(Ssl|Tls[^1]|Tls11|None)'
    risk: HIGH
    description: Insecure TLS/SSL protocol versions
    remediation: Use TLS 1.2 or 1.3 only

  - id: system_random
    name: System.Random
    pattern: 'new\s+Random\s*\(|System\.Random'
    risk: MEDIUM
    description: Non-cryptographic random number generator
    remediation: Use RandomNumberGenerator for security-sensitive operations

  - id: rc2
    name: RC2
    pattern: 'RC2CryptoServiceProvider|RC2\.Create'
    risk: HIGH
    description: RC2 is cryptographically weak
    remediation: Use AES-256

  - id: password_derive_bytes
    name: PasswordDeriveBytes
    pattern: 'PasswordDeriveBytes'
    risk: MEDIUM
    description: Obsolete key derivation function
    remediation: Use Rfc2898DeriveBytes (PBKDF2)
